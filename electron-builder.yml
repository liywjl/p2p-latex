appId: com.p2platex.app
productName: P2P LaTeX
publish:
  provider: github
  owner: liywjl
  repo: p2p-latex
directories:
  output: dist
files:
  - out/**
  - package.json
# native modules (sodium-native, udx-native) load their prebuilds from real
# files on disk — they can't be required from inside the asar archive
asarUnpack:
  - "**/*.node"
  - "**/prebuilds/**"
npmRebuild: false
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
linux:
  target:
    - AppImage
    - deb
  category: Office
win:
  target:
    - nsis

name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Opened my thesis project
        2. Clicked Share this project
        3. …
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 (Apple Silicon) / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the app menu → About
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: TeX engine and version
      description: The engine shown in the status bar, e.g. from `latexmk --version` or `tectonic --version`
      placeholder: Tectonic 0.15.0
  - type: dropdown
    id: sharing
    attributes:
      label: Was a sharing session active?
      options:
        - "No — working alone"
        - "Yes — I was the host"
        - "Yes — I had joined someone's project"
  - type: textarea
    id: log
    attributes:
      label: Compile log or error output (if relevant)
      description: The Errors panel has a "copy log" action. Paste the tail of it here.
      render: text
